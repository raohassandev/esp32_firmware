name: Waveshare backend shared-builder patch

on:
  push:
    branches:
      - 'work/waveshare/backend-parity'
    paths:
      - 'tools/waveshare_backend_shared_builder_patch.py'
      - '.github/workflows/waveshare-backend-builder-patch.yml'

permissions:
  contents: write

jobs:
  apply-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/waveshare/backend-parity
          fetch-depth: 0
      - name: Apply authoritative shared-builder refactor
        run: python3 tools/waveshare_backend_shared_builder_patch.py
      - name: Remove one-shot patch machinery
        run: |
          rm tools/waveshare_backend_shared_builder_patch.py
          rm .github/workflows/waveshare-backend-builder-patch.yml
      - name: Commit refactor to lane branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(waveshare): share authoritative operational builders'
          git push origin HEAD:work/waveshare/backend-parity
