name: Operator UI full application fixture

on:
  pull_request:
    branches:
      - phase1-fix
    paths:
      - 'web/**'
      - 'tests/operator_ui_full_app_fixture_test.mjs'
      - '.github/workflows/operator-ui-full-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check fixture syntax
        run: node --check tests/operator_ui_full_app_fixture_test.mjs
      - name: Run complete bundled application in Chromium
        run: node tests/operator_ui_full_app_fixture_test.mjs
      - name: Upload route screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-full-app
          path: artifacts/operator-ui-full-app
          if-no-files-found: error
          retention-days: 14
