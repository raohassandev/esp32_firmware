name: Operator UI full application fixture

on:
  pull_request:
    branches:
      - phase1-fix
    paths:
      - 'web/**'
      - 'tests/operator_ui_full_app_fixture_test.mjs'
      - '.github/workflows/operator-ui-full-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
      - name: Correct source-visibility expectation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/operator_ui_full_app_fixture_test.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  const verdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(verdict === 'PLANT NORMAL', `Full app verdict is ${verdict || '<missing>'}`);
"""
          new = """  const operatorVerdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(operatorVerdict === 'PLANT STATUS UNKNOWN', `Signed-out operator verdict is ${operatorVerdict || '<missing>'}`);
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('operator verdict assertion not found')
          old2 = """  const access = await evaluate(`document.documentElement.dataset.access`);
          assert(access === 'engineering', `Engineering login did not unlock the application (${access})`);
          await visit('control');
"""
          new2 = """  const access = await evaluate(`document.documentElement.dataset.access`);
          assert(access === 'engineering', `Engineering login did not unlock the application (${access})`);
          await visit('dashboard', 1440, 900, false);
          const engineeringVerdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(engineeringVerdict === 'PLANT NORMAL', `Engineering dashboard verdict is ${engineeringVerdict || '<missing>'}`);
          await visit('control');
"""
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('engineering assertion insertion point not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Check fixture syntax
        run: node --check tests/operator_ui_full_app_fixture_test.mjs
      - name: Run complete bundled application in Chromium
        run: node tests/operator_ui_full_app_fixture_test.mjs
      - name: Commit verified expectation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/operator_ui_full_app_fixture_test.mjs
          git diff --cached --quiet || git commit -m "test(web): respect source visibility boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
      - name: Upload route screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-full-app
          path: artifacts/operator-ui-full-app
          if-no-files-found: error
          retention-days: 14
