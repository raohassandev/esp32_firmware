name: Operator UI full application fixture

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tests/operator_ui_browser_runtime_test.mjs'
      - 'tests/operator_ui_full_app_fixture_test.mjs'
      - 'tests/operator_ui_full_app_fixture_runner.mjs'
      - '.github/workflows/operator-ui-full-app.yml'
  push:
    branches:
      - main
      - dev
      - 'phase1-**'
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'web/**'
      - 'tests/operator_ui_browser_runtime_test.mjs'
      - 'tests/operator_ui_full_app_fixture_test.mjs'
      - 'tests/operator_ui_full_app_fixture_runner.mjs'
      - '.github/workflows/operator-ui-full-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check browser fixture modules
        run: |
          node --check tests/operator_ui_browser_runtime_test.mjs
          node --check tests/operator_ui_full_app_fixture_test.mjs
          node --check tests/operator_ui_full_app_fixture_runner.mjs
      - name: Run component-level Chromium contract
        run: node tests/operator_ui_browser_runtime_test.mjs
      - name: Run complete bundled application fixture
        run: node tests/operator_ui_full_app_fixture_runner.mjs
      - name: Upload complete-app screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-ui-full-app
          path: artifacts/operator-ui-full-app
          if-no-files-found: error
          retention-days: 14
