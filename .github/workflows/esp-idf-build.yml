name: Firmware and web checks

on:
  pull_request:
  push:
    branches:
      - fix/pvdg-reconnect-admission-gate
      - feature/pvdg-batch3-consolidated

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check browser modules
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/wifi-utils.js
          node --check web/wifi-guard.js
          node --check web/wifi.js
          node --check web/devices-utils.js
          node --check web/devices.js
          node --check web/devices-refresh.js
          node web/tests/wifi-utils.test.js
          node web/tests/devices-utils.test.js
      - name: Check telemetry source contract
        run: python3 tests/telemetry_source_contract.py

  build:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32s3 > /tmp/idf-target.log 2>&1 || {
            cat /tmp/idf-target.log
            exit 1
          }
          idf.py build > /tmp/idf-build.log 2>&1 || {
            tail -n 250 /tmp/idf-build.log
            exit 1
          }
          test -f build/automatrix_pvdg.bin
          grep -E "Project build complete|binary size|Smallest app partition|free" /tmp/idf-build.log || true
          stat -c "Application binary bytes: %s" build/automatrix_pvdg.bin
          if grep -E "warning:" /tmp/idf-build.log > /tmp/project-warnings.log; then
            echo "Compiler warnings detected:"
            cat /tmp/project-warnings.log
            exit 1
          fi
          echo "Compiler warnings: 0"
