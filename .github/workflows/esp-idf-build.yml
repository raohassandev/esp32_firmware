name: ESP-IDF build

on:
  pull_request:
  push:
    branches:
      - fix/pvdg-reconnect-admission-gate

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Configure target
        run: idf.py set-target esp32s3
      - name: Build firmware
        run: idf.py build
      - name: Check firmware output
        run: test -f build/automatrix_pvdg.bin
