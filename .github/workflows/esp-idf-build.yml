name: ESP-IDF build

on:
  pull_request:
  push:
    branches:
      - fix/pvdg-reconnect-admission-gate

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32s3
          idf.py build
          test -f build/automatrix_pvdg.bin
