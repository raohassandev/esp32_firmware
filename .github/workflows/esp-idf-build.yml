name: Firmware and web checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      # The integration branch this release is being assembled on. It was absent,
      # so every push to it skipped CI entirely and the checks below had never once
      # run against the branch that actually carries the work.
      - 'phase1-**'
  workflow_dispatch:
    inputs:
      production_release:
        description: Enforce production release compile-time gates
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check browser modules
        run: |
          set -euo pipefail
          node --check web/theme.js
          node --check web/product-mode.js
          node --check web/operator-view.js
          node --check web/operator-operations.js
          node --check web/operator-product-suite.js
          node --check web/prelab-readiness.js
          node --check web/product-shell-v2.js
          node --check web/product-experience-v2.js
          node --check web/commissioning-wizard-v2.js
          node --check web/commissioning-release-v3.js
          node --check web/engineering-errors.js
          node --check web/app.js
          node --check web/ui-enhancements.js
          node --check web/wifi-utils.js
          node --check web/wifi-guard.js
          node --check web/wifi.js
          node --check web/network-commissioning-fix.js
          node --check web/devices-utils.js
          node --check web/devices.js
          node --check web/devices-refresh.js
          node --check web/inverter-profiles.js
          node --check web/inverter-config.js
          node --check web/inverter-telemetry.js
          node --check web/em500-utils.js
          node --check web/em500-core.js
          node --check web/em500-quality.js
          node --check web/em500-profiles.js
          node --check web/em500-plan.js
          node --check web/source-detection.js
          node --check web/solar-grid.js
          node --check web/pvdg-chart.js
          node --check tools/soltrix_modbus_simulator.js
          node --check tools/soltrix_modbus_simulator_test.js
          node tools/soltrix_modbus_simulator_test.js
          node web/tests/wifi-utils.test.js
          node web/tests/devices-utils.test.js
          node web/tests/em500-utils.test.js
          node web/tests/chart-utils.test.js
          node web/tests/source-detection-utils.test.js
      - name: Run source mode safety unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/control_engine/include \
            tests/source_mode_unit_test.c components/control_engine/source_mode.c \
            -lm -o /tmp/source_mode_unit_test
          /tmp/source_mode_unit_test
      - name: Run EM500 source detection unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/source_detection/include \
            tests/source_detection_engine_test.c \
            components/source_detection/source_detection_engine.c \
            -lm -o /tmp/source_detection_engine_test
          /tmp/source_detection_engine_test
      - name: Run inverter power-limit scale factor unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Itests/support -Icomponents/inverter_manager/include \
            tests/inverter_power_scale_test.c \
            components/inverter_manager/inverter_profiles.c \
            components/inverter_manager/inverter_status.c \
            components/inverter_manager/inverter_profile_decode.c \
            -lm -o /tmp/inverter_power_scale_test
          /tmp/inverter_power_scale_test
      - name: Run EM500 tariff to generator curtailment end-to-end tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Itests/support \
            -Icomponents/source_detection/include \
            -Icomponents/control_engine/include \
            -Icomponents/inverter_manager/include \
            tests/source_transition_e2e_test.c \
            components/source_detection/source_detection_engine.c \
            components/control_engine/source_mode.c \
            components/control_engine/power_control_policy.c \
            components/inverter_manager/inverter_profiles.c \
            components/inverter_manager/inverter_status.c \
            components/inverter_manager/inverter_profile_decode.c \
            -lm -o /tmp/source_transition_e2e_test
          /tmp/source_transition_e2e_test
      - name: Run commissioning gate unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/commissioning_gate/include \
            tests/commissioning_gate_test.c \
            components/commissioning_gate/commissioning_gate.c \
            -lm -o /tmp/commissioning_gate_test
          /tmp/commissioning_gate_test
      - name: Run aggregate generator limit unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/control_engine/include \
            tests/generator_fleet_limit_test.c \
            components/control_engine/generator_fleet_limit.c \
            components/control_engine/source_mode.c \
            -lm -o /tmp/generator_fleet_limit_test
          /tmp/generator_fleet_limit_test
      - name: Run inverter write confirmation unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/inverter_manager/include \
            tests/inverter_write_confirmation_test.c \
            components/inverter_manager/inverter_write_confirmation.c \
            -lm -o /tmp/inverter_write_confirmation_test
          /tmp/inverter_write_confirmation_test
      - name: Run inverter float register encode and decode unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Itests/support -Icomponents/inverter_manager/include \
            tests/inverter_float_register_test.c \
            components/inverter_manager/inverter_profile_decode.c \
            -lm -o /tmp/inverter_float_register_test
          /tmp/inverter_float_register_test
      - name: Run inverter prerequisite enable sequencing unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/inverter_manager/include \
            tests/inverter_prerequisite_test.c \
            components/inverter_manager/inverter_prerequisite.c \
            -lm -o /tmp/inverter_prerequisite_test
          /tmp/inverter_prerequisite_test
      - name: Run Solar-Grid integration tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/control_engine/include \
            tests/solar_grid_integration_test.c \
            components/control_engine/source_mode.c \
            components/control_engine/grid_control_gate.c \
            components/control_engine/power_control_policy.c \
            -lm -o /tmp/solar_grid_integration_test
          /tmp/solar_grid_integration_test
      - name: Run SolTrix Modbus inverter simulator self-test
        run: |
          set -euo pipefail
          node tools/soltrix_modbus_simulator.js --self-test
          node tools/soltrix_modbus_simulator_test.js
      - name: Check telemetry source contract
        run: python3 tests/telemetry_source_contract.py
      - name: Check multi-meter configuration contract
        run: python3 tests/multi_meter_config_source_contract.py
      - name: Check EM500 source detection contract
        run: python3 tests/em500_source_detection_source_contract.py
      - name: Check source semantics and power-limit scale contract
        run: python3 tests/source_semantics_and_power_scale_source_contract.py
      - name: Check release phase scope contract
        run: python3 tests/phase_scope_source_contract.py
      - name: Check phase scope is visible in the inverter profile picker
        run: python3 tests/inverter_phase_scope_ui_source_contract.py
      - name: Check meter role and schema 4 upgrade contract
        run: python3 tests/meter_role_source_contract.py
      - name: Check generator power policy contract
        run: python3 tests/generator_power_policy_source_contract.py
      - name: Check source transition contract
        run: python3 tests/source_transition_source_contract.py
      - name: Check generator limits API contract
        run: python3 tests/generator_limits_api_source_contract.py
      - name: Check configuration import safety contract
        run: python3 tests/config_import_safety_source_contract.py
      - name: Check persisted Solar-Grid control contract
        run: python3 tests/solar_grid_control_source_contract.py
      - name: Check Modbus runtime safety contract
        run: python3 tests/modbus_runtime_safety_source_contract.py
      - name: Check 64-bit energy decoder contract
        run: python3 tests/modbus_u64_decoder_source_contract.py
      - name: Check EM500 snapshot contract
        run: python3 tests/em500_snapshot_source_contract.py
      - name: Check EM500 historical measurement contract
        run: python3 tests/em500_history_source_contract.py
      - name: Check complete EM500 settings contract
        run: python3 tests/em500_settings_source_contract.py
      - name: Check EM500 settings change-plan contract
        run: python3 tests/em500_settings_plan_source_contract.py
      - name: Check EM500 web asset delivery contract
        run: python3 tests/em500_web_assets_source_contract.py
      - name: Check EM500 visibility and scaling contract
        run: python3 tests/em500_visibility_and_scaling_source_contract.py
      - name: Check inverter configuration contract
        run: python3 tests/inverter_config_source_contract.py
      - name: Check inverter profile catalogue safety contract
        run: python3 tests/inverter_profile_catalogue_source_contract.py
      - name: Check brand register-map evidence contract
        run: python3 tests/brand_profile_evidence_source_contract.py
      - name: Check brand register-map evidence contract (round 2)
        run: python3 tests/brand_profile_evidence_round2_source_contract.py
      - name: Check inverter profile catalogue API contract
        run: python3 tests/inverter_profile_api_source_contract.py
      - name: Check inverter profile picker contract
        run: python3 tests/inverter_profile_picker_source_contract.py
      - name: Check runtime inverter write gate
        run: python3 tests/inverter_runtime_write_gate_source_contract.py
      - name: Check commissioning gate contract
        run: python3 tests/commissioning_gate_source_contract.py
      - name: Check inverter write confirmation and readback contract
        run: python3 tests/inverter_write_readback_source_contract.py
      - name: Check plant-level logger control and measured-power confirmation
        run: python3 tests/logger_plant_control_source_contract.py
      - name: Check inverter prerequisite enable sequencing contract
        run: python3 tests/inverter_prerequisite_enable_source_contract.py
      - name: Check inverter read-only probe contract
        run: python3 tests/inverter_read_probe_source_contract.py
      - name: Check inverter decoder contract
        run: python3 tests/inverter_profile_decode_source_contract.py
      - name: Check inverter float register support contract
        run: python3 tests/inverter_float_register_source_contract.py
      - name: Check inverter operational status contract
        run: python3 tests/inverter_status_source_contract.py
      - name: Check inverter telemetry simulator contract
        run: python3 tests/inverter_telemetry_simulator_source_contract.py
      - name: Check persistent light and dark theme contract
        run: python3 tests/theme_toggle_source_contract.py
      - name: Check UI and runtime consistency contract
        run: python3 tests/ui_runtime_consistency_source_contract.py
      - name: Check UI runtime performance
        run: python3 tests/ui_runtime_performance_source_contract.py
      - name: Check product and engineering separation contract
        run: python3 tests/product_engineering_access_source_contract.py
      - name: Check operator meter access boundary
        run: python3 tests/operator_meter_access_source_contract.py
      - name: Check operator history and event center
        run: python3 tests/operator_history_events_source_contract.py
      - name: Check ISA-18.2 and EEMUA 191 alarm management contract
        run: python3 tests/alarm_management_source_contract.py
      - name: Check alarm acknowledgement authority contract
        run: python3 tests/alarm_ack_authority_source_contract.py
      - name: Check persistent alarm journal and ISA-18.2 shelving contract
        run: python3 tests/alarm_journal_shelving_source_contract.py
      - name: Check ISA-18.2 suppressed-by-design and out-of-service contract
        run: python3 tests/alarm_suppression_states_source_contract.py
      - name: Check EEMUA 191 priority rationalisation and alarm-rate metrics contract
        run: python3 tests/alarm_rate_and_priority_source_contract.py
      - name: Check HTTP route capacity leads the registered routes
        run: python3 tests/uri_handler_capacity_source_contract.py
      - name: Check no credential is shared across units
        run: python3 tests/no_shared_credentials_source_contract.py
      - name: Check the shipped configuration samples
        run: python3 tests/config_samples_source_contract.py
      - name: Check the release document matches the compiled profile catalogue
        run: python3 tests/release_doc_catalogue_source_contract.py
      - name: Check lab-simulator write gate cannot reach production authority
        run: python3 tests/lab_target_write_gate_source_contract.py
      - name: Run meter poll schedule unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/meter_manager/include \
            tests/meter_poll_schedule_test.c \
            components/meter_manager/meter_poll_schedule.c \
            -lm -o /tmp/meter_poll_schedule_test
          /tmp/meter_poll_schedule_test
      - name: Run EEMUA 191 alarm metrics unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/web_server/include \
            tests/alarm_metrics_test.c \
            components/web_server/alarm_metrics.c \
            -lm -o /tmp/alarm_metrics_test
          /tmp/alarm_metrics_test
      - name: Run ISA-18.2 alarm suppression state machine unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Icomponents/web_server/include \
            tests/alarm_suppression_test.c \
            components/web_server/alarm_suppression.c \
            -lm -o /tmp/alarm_suppression_test
          /tmp/alarm_suppression_test
      - name: Run inverter write permission unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Itests/support -Icomponents/inverter_manager/include \
            tests/inverter_write_permission_test.c \
            components/inverter_manager/inverter_profiles.c \
            components/inverter_manager/inverter_status.c \
            -lm -o /tmp/inverter_write_permission_test
          /tmp/inverter_write_permission_test
      - name: Check complete operator product suite
        run: python3 tests/operator_product_suite_source_contract.py
      - name: Check pre-lab readiness workspace
        run: python3 tests/prelab_readiness_source_contract.py
      - name: Check resilient network commissioning
        run: python3 tests/network_commissioning_flow_source_contract.py
      - name: Check mobile pre-lab layout
        run: python3 tests/mobile_prelab_source_contract.py
      - name: Check product shell V2
        run: python3 tests/product_shell_v2_source_contract.py
      - name: Check unified product experience V2
        run: python3 tests/product_experience_v2_source_contract.py
      - name: Check guided commissioning workflow V2
        run: python3 tests/commissioning_wizard_v2_source_contract.py
      - name: Check controller resource telemetry
        run: python3 tests/system_resource_api_source_contract.py
      - name: Check controller identity and audit trail contract
        run: python3 tests/audit_log_source_contract.py
      - name: Check commissioning release V3
        run: python3 tests/commissioning_release_v3_source_contract.py
      - name: Check engineering auth-loop prevention
        run: python3 tests/engineering_auth_loop_source_contract.py
      - name: Check production access policy
        run: python3 tests/release_access_policy_source_contract.py
      - name: Check operator endpoint scope and ramp commissioning UI
        run: python3 tests/operator_endpoint_scope_source_contract.py
      - name: Check alarm management UI
        run: python3 tests/alarm_ui_source_contract.py
      - name: Check site power-flow model
        run: python3 tests/power_flow_model_source_contract.py
      - name: Check information architecture, state taxonomy and trends
        run: python3 tests/ia_taxonomy_source_contract.py
      - name: Check lab simulator authority, setpoint confirmation and gate UI
        run: python3 tests/lab_control_ui_source_contract.py
      - name: Check prerequisite enable register reporting
        run: python3 tests/prerequisite_reporting_source_contract.py
      - name: Run write confirmation provenance roll-up unit tests
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Itests/support -Icomponents/web_server/include \
            -Icomponents/inverter_manager/include \
            tests/write_provenance_test.c \
            components/web_server/write_provenance.c \
            components/inverter_manager/inverter_write_confirmation.c \
            -lm -o /tmp/write_provenance_test
          /tmp/write_provenance_test
      - name: Check confirmation provenance reporting and UI
        run: python3 tests/confirmation_provenance_source_contract.py
      - name: Check multi-engine generator commissioning API and UI
        run: python3 tests/multi_engine_commissioning_source_contract.py
      - name: Check base-load setpoint drift detection
        run: python3 tests/base_load_drift_source_contract.py
      - name: Check network discovery and recovery access contract
        run: python3 tests/network_discovery_recovery_source_contract.py
      - name: Enforce production release gate
        env:
          PVDG_PRODUCTION_RELEASE: ${{ inputs.production_release && '1' || '0' }}
        run: python3 tests/production_release_gate.py

  build:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          idf.py --version
          idf.py set-target esp32s3 > /tmp/idf-target.log 2>&1 || {
            cp /tmp/idf-target.log "$GITHUB_WORKSPACE/idf-build-failure.log"
            cat /tmp/idf-target.log
            exit 1
          }
          idf.py build > /tmp/idf-build.log 2>&1 || {
            cp /tmp/idf-build.log "$GITHUB_WORKSPACE/idf-build-failure.log"
            echo "ESP-IDF compiler diagnostics:"
            grep -nE "FAILED:|fatal error:|error:|undefined reference|collect2:" /tmp/idf-build.log | tail -n 100 || true
            echo "Final build context:"
            tail -n 60 /tmp/idf-build.log
            exit 1
          }
          test -f build/automatrix_pvdg.bin
          if grep -E "warning:" /tmp/idf-build.log > /tmp/project-warnings.log; then
            cp /tmp/idf-build.log "$GITHUB_WORKSPACE/idf-build-failure.log"
            echo "Compiler warnings detected:"
            cat /tmp/project-warnings.log
            exit 1
          fi
          {
            grep -E "Project build complete|binary size|Smallest app partition|free" /tmp/idf-build.log || true
            stat -c "Application binary bytes: %s" build/automatrix_pvdg.bin
            echo "Compiler warnings: 0"
          } | tee build/build-metrics.txt
      - name: Publish ESP-IDF failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-build-failure-log
          path: idf-build-failure.log
          if-no-files-found: warn
          retention-days: 7
      - name: Publish non-secret build metrics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-metrics
          path: build/build-metrics.txt
          if-no-files-found: error
          retention-days: 14
