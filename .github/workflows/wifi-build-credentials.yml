name: Wi-Fi build credential checks

on:
  pull_request:
    paths:
      - 'sdkconfig.defaults'
      - 'main/Kconfig.projbuild'
      - 'components/config_manager/**'
      - 'tests/wifi_build_credentials_source_contract.py'
      - '.github/workflows/wifi-build-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check production Wi-Fi defaults and NVS preservation
        run: python3 tests/wifi_build_credentials_source_contract.py
