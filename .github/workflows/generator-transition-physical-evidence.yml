name: Generator transition physical evidence tools

on:
  pull_request:
    paths:
      - 'tools/generator_transition_physical_verify.py'
      - 'tools/generator_transition_physical.example.json'
      - 'tests/generator_transition_physical_tools_test.py'
      - 'docs/GENERATOR_TRANSITION_PHYSICAL_EVIDENCE.md'
      - '.github/workflows/generator-transition-physical-evidence.yml'
  push:
    branches: [dev]
    paths:
      - 'tools/generator_transition_physical_verify.py'
      - 'tools/generator_transition_physical.example.json'
      - 'tests/generator_transition_physical_tools_test.py'
      - 'docs/GENERATOR_TRANSITION_PHYSICAL_EVIDENCE.md'
      - '.github/workflows/generator-transition-physical-evidence.yml'

jobs:
  evidence-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile generator evidence validator
        run: python3 -m py_compile tools/generator_transition_physical_verify.py
      - name: Run generator physical evidence validator tests
        run: python3 tests/generator_transition_physical_tools_test.py
      - name: Confirm example record fails closed before physical execution
        run: |
          ! python3 tools/generator_transition_physical_verify.py \
            tools/generator_transition_physical.example.json \
            --expected-firmware-sha a1620789235d21b515f9f245f2329fab88b50558 \
            --expected-artifact-digest sha256:not-a-physical-artifact
