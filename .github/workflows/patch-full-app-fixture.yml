name: Patch full app fixture expectation

on:
  pull_request:
    branches:
      - phase1-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
      - name: Correct safety-state expectation and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/operator_ui_full_app_fixture_test.mjs')
          text = path.read_text(encoding='utf-8')
          old = """  const verdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(verdict === 'PLANT NORMAL', `Full app verdict is ${verdict || '<missing>'}`);
"""
          new = """  const operatorVerdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(operatorVerdict === 'PLANT STATUS UNKNOWN', `Signed-out operator verdict is ${operatorVerdict || '<missing>'}`);
"""
          if old not in text:
              raise SystemExit('operator verdict assertion not found')
          text = text.replace(old, new, 1)
          old2 = """  const access = await evaluate(`document.documentElement.dataset.access`);
          assert(access === 'engineering', `Engineering login did not unlock the application (${access})`);
          await visit('control');
"""
          new2 = """  const access = await evaluate(`document.documentElement.dataset.access`);
          assert(access === 'engineering', `Engineering login did not unlock the application (${access})`);
          await visit('dashboard', 1440, 900, false);
          const engineeringVerdict = await evaluate(`document.getElementById('plantVerdictValue')?.textContent || ''`);
          assert(engineeringVerdict === 'PLANT NORMAL', `Engineering dashboard verdict is ${engineeringVerdict || '<missing>'}`);
          await visit('control');
"""
          if old2 not in text:
              raise SystemExit('engineering assertion insertion point not found')
          path.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          PY
          node --check tests/operator_ui_full_app_fixture_test.mjs
          node tests/operator_ui_full_app_fixture_test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/operator_ui_full_app_fixture_test.mjs
          git commit -m "test(web): respect source visibility boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
