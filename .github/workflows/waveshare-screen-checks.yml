name: Waveshare screen checks

on:
  push:
    branches:
      - 'board/waveshare-esp32-s3-touch-lcd-5'
    paths:
      - 'boards/waveshare_esp32_s3_touch_lcd_5/screen/**'
      - 'components/**'
      - 'tests/waveshare_*'
      - '.github/workflows/waveshare-screen-checks.yml'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'boards/waveshare_esp32_s3_touch_lcd_5/screen/**'
      - 'components/**'
      - 'tests/waveshare_*'
      - '.github/workflows/waveshare-screen-checks.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify screen isolation and existing API ownership
        run: |
          python3 -m py_compile tests/waveshare_screen_source_contract.py
          python3 tests/waveshare_screen_source_contract.py

      - name: Compile display profile tests with warnings as errors
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Iboards/waveshare_esp32_s3_touch_lcd_5/screen/drivers \
            tests/waveshare_display_profile_test.c \
            boards/waveshare_esp32_s3_touch_lcd_5/screen/drivers/waveshare_display_profile.c \
            -o /tmp/waveshare_display_profile_test
          /tmp/waveshare_display_profile_test

      - name: Install cJSON host headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcjson-dev

      - name: Compile screen API parser tests with warnings as errors
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -I/usr/include/cjson \
            -Iboards/waveshare_esp32_s3_touch_lcd_5/screen/api \
            tests/waveshare_screen_api_test.c \
            boards/waveshare_esp32_s3_touch_lcd_5/screen/api/screen_api.c \
            -lcjson -lm \
            -o /tmp/waveshare_screen_api_test
          /tmp/waveshare_screen_api_test

      - name: Confirm current default firmware does not compile the screen component
        run: |
          set -euo pipefail
          if grep -q 'waveshare_esp32_s3_touch_lcd_5/screen' CMakeLists.txt; then
            echo 'Screen component leaked into the site-tested default build.' >&2
            exit 1
          fi
          echo 'Default build isolation: PASS'

  screen-software-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated product screen on ESP-IDF 6.0.1
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/boards/waveshare_esp32_s3_touch_lcd_5/screen/qualification \
            espressif/idf:v6.0.1 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build'

  hil-800x480-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile real LCD/touch HIL image on ESP-IDF 6.0.1
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/boards/waveshare_esp32_s3_touch_lcd_5/screen/hil_800x480 \
            espressif/idf:v6.0.1 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build && test -f build/waveshare_screen_hil_800x480.bin'

  product-800x480-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared-Core plus Waveshare product image on ESP-IDF 6.0.1
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/boards/waveshare_esp32_s3_touch_lcd_5/screen/product_800x480 \
            espressif/idf:v6.0.1 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build && test -f build/automatrix_pvdg_waveshare_800x480.bin'

  vendor-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned Waveshare hardware reference provenance
        run: |
          set -euo pipefail
          rm -rf /tmp/waveshare
          git clone --filter=blob:none https://github.com/waveshareteam/ESP32-S3-Touch-LCD-5.git /tmp/waveshare
          git -C /tmp/waveshare checkout a7b179dbfccea8121c88770d8a3c53e5a84b1024
          test "$(git -C /tmp/waveshare rev-parse HEAD)" = "a7b179dbfccea8121c88770d8a3c53e5a84b1024"
          test -f /tmp/waveshare/examples/ESP-IDF/09_lvgl_v9_demo/components/waveshare_rgb_lcd_port.c
          test -f /tmp/waveshare/examples/ESP-IDF/09_lvgl_v9_demo/README.md
          echo 'Pinned Waveshare reference provenance: PASS'
