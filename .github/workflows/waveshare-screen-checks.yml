name: Waveshare screen checks

on:
  push:
    branches:
      - 'board/waveshare-esp32-s3-touch-lcd-5'
    paths:
      - 'boards/waveshare_esp32_s3_touch_lcd_5/screen/**'
      - 'components/web_server/**'
      - 'tests/waveshare_*'
      - '.github/workflows/waveshare-screen-checks.yml'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'boards/waveshare_esp32_s3_touch_lcd_5/screen/**'
      - 'components/web_server/**'
      - 'tests/waveshare_*'
      - '.github/workflows/waveshare-screen-checks.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify screen isolation and existing API ownership
        run: |
          python3 -m py_compile tests/waveshare_screen_source_contract.py
          python3 tests/waveshare_screen_source_contract.py

      - name: Compile display profile tests with warnings as errors
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -Iboards/waveshare_esp32_s3_touch_lcd_5/screen/drivers \
            tests/waveshare_display_profile_test.c \
            boards/waveshare_esp32_s3_touch_lcd_5/screen/drivers/waveshare_display_profile.c \
            -o /tmp/waveshare_display_profile_test
          /tmp/waveshare_display_profile_test

      - name: Install cJSON host headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libcjson-dev

      - name: Compile screen API parser tests with warnings as errors
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror \
            -I/usr/include/cjson \
            -Iboards/waveshare_esp32_s3_touch_lcd_5/screen/api \
            tests/waveshare_screen_api_test.c \
            boards/waveshare_esp32_s3_touch_lcd_5/screen/api/screen_api.c \
            -lcjson -lm \
            -o /tmp/waveshare_screen_api_test
          /tmp/waveshare_screen_api_test

      - name: Confirm current default firmware does not compile the screen component
        run: |
          set -euo pipefail
          if grep -q 'waveshare_esp32_s3_touch_lcd_5/screen' CMakeLists.txt; then
            echo 'Screen component leaked into the site-tested default build.' >&2
            exit 1
          fi
          echo 'Default build isolation: PASS'
