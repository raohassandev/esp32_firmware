name: One-shot repository maintenance

on:
  push:
    branches: [hardware/kicad-reva-implementation]
    paths:
      - '.github/workflows/repo-maintenance.yml'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.repository == 'raohassandev/esp32_firmware'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete audited absorbed branches and prune superseded runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'automatrix-repo-maintenance',
          }
          failures = []

          def request(method, path, expected=(200, 204)):
              req = urllib.request.Request(base + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      code = resp.status
              except urllib.error.HTTPError as exc:
                  body = exc.read()
                  code = exc.code
              if code not in expected:
                  text = body.decode('utf-8', errors='replace')[:500]
                  raise RuntimeError(f'{method} {path} -> HTTP {code}: {text}')
              return code, body

          # Delete only branches whose heads are exactly the SHAs audited before
          # this maintenance commit. A moved branch is preserved automatically.
          absorbed = {
              'fix/generator-urgent-ramp-ci-includes': 'dc631a559f46446338dc0af90d1e18291148d999',
              'hardware/reva-enclosure': '7bda7bcc6566ee9df26268b433f738495a1a12a5',
              'hardware/reva-interfaces-audit': '89fb50d844ba7bbce197c7fbe0d6bc5560a94ace',
              'hardware/reva-power-relay-audit': '29e67342cf5faacffcb2783767ac3a2388487b35',
              'hardware/reva-provider-package': '385f6f47e730e1ae8ecf6fde475c94d4d62cadd8',
          }

          for branch, expected_sha in absorbed.items():
              encoded = urllib.parse.quote('heads/' + branch, safe='/')
              try:
                  _, body = request('GET', f'/git/ref/{encoded}', expected=(200,))
                  actual = json.loads(body)['object']['sha']
                  if actual != expected_sha:
                      failures.append(f'BRANCH PRESERVED (head moved): {branch} expected={expected_sha} actual={actual}')
                      continue
                  request('DELETE', f'/git/refs/{encoded}', expected=(204,))
                  print(f'BRANCH DELETED: {branch} @ {actual}')
              except Exception as exc:
                  failures.append(f'BRANCH CLEANUP FAILED: {branch}: {exc}')

          branch = 'hardware/kicad-reva-implementation'

          # Retain a small evidence window; delete only completed superseded runs.
          policies = [
              ('kicad-reva-pr-validation.yml', 'pull_request', 3),
              ('kicad-reva-validation.yml', 'push', 3),
              ('esp-idf-build.yml', 'pull_request', 1),
              ('reva-provider-package-gate.yml', 'push', 2),
              ('reva-enclosure-contract.yml', 'push', 2),
          ]

          for workflow, event, keep in policies:
              query = urllib.parse.urlencode({
                  'branch': branch,
                  'event': event,
                  'status': 'completed',
                  'per_page': 100,
              })
              wf = urllib.parse.quote(workflow, safe='')
              try:
                  _, body = request('GET', f'/actions/workflows/{wf}/runs?{query}', expected=(200,))
                  runs = json.loads(body).get('workflow_runs', [])
                  runs.sort(key=lambda r: (r.get('created_at', ''), r.get('id', 0)), reverse=True)
                  kept = runs[:keep]
                  doomed = runs[keep:]
                  print(f'RUN POLICY: {workflow} completed={len(runs)} keep={len(kept)} delete={len(doomed)}')
                  for run in doomed:
                      request('DELETE', f"/actions/runs/{run['id']}", expected=(204,))
                      print(f"RUN DELETED: {workflow} #{run.get('run_number')} id={run['id']} conclusion={run.get('conclusion')}")
              except Exception as exc:
                  failures.append(f'RUN CLEANUP FAILED: {workflow}: {exc}')

          if failures:
              print('\nMAINTENANCE WARNINGS/FAILURES:')
              for item in failures:
                  print(' -', item)
              sys.exit(1)

          print('REPOSITORY MAINTENANCE: PASS')
          PY
