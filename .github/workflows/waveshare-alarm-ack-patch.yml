name: Temporary Waveshare alarm acknowledgement patch

on:
  push:
    branches:
      - work/waveshare/industrial-ui-v1-integration
    paths:
      - '.github/workflows/waveshare-alarm-ack-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/waveshare/industrial-ui-v1-integration
          fetch-depth: 0

      - name: Apply asserted source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path('components/web_server/operational_api.c')
          text = path.read_text()
          if 'bool operational_api_acknowledge_alarm(uint32_t code,' in text:
              raise SystemExit('operational acknowledgement function already exists')

          marker = '''/* Acknowledgement is a deliberate act, so it names the condition rather than
 * offering a blanket "clear all": acknowledging something an operator has not
 * looked at is exactly what this is meant to prevent. It never clears the
 * condition - only the plant can do that. */
'''
          function = '''bool operational_api_acknowledge_alarm(uint32_t code,
                                       bool *present,
                                       bool *was_outstanding)
{
    if (present) *present = false;
    if (was_outstanding) *was_outstanding = false;
    if ((size_t)code >= sizeof(s_alarms) / sizeof(s_alarms[0]) ||
        !event_is_alarm_condition((uint8_t)code)) {
        return false;
    }

    const uint32_t timestamp = now_ms();
    bool current_present = false;
    bool outstanding = false;
    portENTER_CRITICAL(&s_lock);
    operational_alarm_t *alarm = &s_alarms[code];
    current_present = alarm->present;
    outstanding = !alarm->acknowledged && alarm->occurrences > 0U;
    if (outstanding) {
        alarm->acknowledged = true;
        alarm->acknowledged_ms = timestamp;
    }
    portEXIT_CRITICAL(&s_lock);

    if (present) *present = current_present;
    if (was_outstanding) *was_outstanding = outstanding;
    return true;
}

'''
          text = replace_once(text, marker, function + marker, 'insert operational acknowledge')

          ack_handler = text.index('static esp_err_t alarms_ack_post(httpd_req_t *request)')
          start = text.index('    if (!have_code || code < 0 ||\n', ack_handler)
          end = text.index('    cJSON *reply = cJSON_CreateObject();\n', start)
          replacement = '''    bool present = false;
    bool was_outstanding = false;
    if (!have_code || code < 0 ||
        !operational_api_acknowledge_alarm((uint32_t)code,
                                           &present,
                                           &was_outstanding)) {
        cJSON *err = cJSON_CreateObject();
        if (!err) return httpd_resp_send_500(request);
        cJSON_AddStringToObject(err, "error", "A known alarm code is required");
        return send_json_status(request, "400 Bad Request", err);
    }

'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

          path = Path('boards/waveshare_esp32_s3_touch_lcd_5/screen/product_800x480/main/local_commissioning_backend.c')
          text = path.read_text()
          if 'local_commissioning_backend_engineering_authorized' in text:
              raise SystemExit('local Engineering authorization function already exists')
          marker = '''static void result_set(screen_commission_action_result_t *result,
                       bool ok, bool restart_required, const char *message)
'''
          function = '''bool local_commissioning_backend_engineering_authorized(void)
{
    if (!unlocked()) return false;
    s_unlocked_until_ms = now_ms() + LOCAL_ENGINEERING_SESSION_MS;
    return true;
}

'''
          text = replace_once(text, marker, function + marker, 'insert local Engineering session gate')
          path.write_text(text)

          path = Path('boards/waveshare_esp32_s3_touch_lcd_5/screen/product_800x480/main/main.c')
          text = path.read_text()
          text = replace_once(text,
                              '#include <stdint.h>\n#include <stdlib.h>\n',
                              '#include <stdint.h>\n#include <stdio.h>\n#include <stdlib.h>\n',
                              'add stdio include')
          text = replace_once(text,
                              '#include "app_core.h"\n',
                              '#include "alarms_screen.h"\n#include "app_core.h"\n',
                              'add alarms screen include')
          if '#include "operational_api.h"\n' not in text:
              text = replace_once(text,
                                  '#include "lvgl.h"\n',
                                  '#include "lvgl.h"\n#include "operational_api.h"\n',
                                  'add operational API include')

          callback_marker = 'static void log_dma_headroom(const char *stage)\n'
          callback = '''static bool touchscreen_acknowledge_alarm(void *context,
                                          uint32_t code,
                                          char *message,
                                          size_t message_capacity)
{
    (void)context;
    if (!message || message_capacity == 0U) return false;
    message[0] = '\\0';

    if (!local_commissioning_backend_engineering_authorized()) {
        snprintf(message, message_capacity,
                 "Engineering unlock required. Open Commission, unlock Engineering, then return to Alarms.");
        return false;
    }

    bool present = false;
    bool was_outstanding = false;
    if (!operational_api_acknowledge_alarm(code, &present, &was_outstanding)) {
        snprintf(message, message_capacity,
                 "Alarm code is no longer valid; state was not changed.");
        return false;
    }

    if (!was_outstanding) {
        snprintf(message, message_capacity, "Alarm is already acknowledged.");
        return true;
    }
    snprintf(message, message_capacity,
             present
                 ? "Alarm acknowledged. The condition remains active until the plant clears it."
                 : "Returned-to-normal alarm acknowledged and discharged from outstanding work.");
    return true;
}

'''
          text = replace_once(text, callback_marker, callback + callback_marker,
                              'insert touchscreen acknowledgement callback')

          bind_old = '''                    screen_app_set_commissioning_backend(&s_commissioning_backend);
                    esp_lv_adapter_unlock();
'''
          bind_new = '''                    screen_app_set_commissioning_backend(&s_commissioning_backend);
                    alarms_screen_set_acknowledge_backend(touchscreen_acknowledge_alarm, NULL);
                    esp_lv_adapter_unlock();
'''
          text = replace_once(text, bind_old, bind_new, 'bind alarm acknowledgement backend')
          path.write_text(text)

          Path('.github/workflows/waveshare-alarm-ack-patch.yml').unlink()
          PY

          git diff --check
          git diff --stat

      - name: Commit exact patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Waveshare: bind authenticated native alarm acknowledgement'
          git push origin HEAD:work/waveshare/industrial-ui-v1-integration
