name: KiCad Rev-A validation

on:
  push:
    branches:
      - hardware/kicad-reva-implementation
    paths:
      - 'hardware/kicad/**'
      - '.github/workflows/kicad-reva-validation.yml'

permissions:
  contents: write

concurrency:
  group: kicad-reva-implementation
  cancel-in-progress: true

jobs:
  kicad-parse-and-erc:
    runs-on: [self-hosted, macOS, vems]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: KiCad version
        run: |
          KICAD='/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli'
          test -x "$KICAD"
          "$KICAD" version --format about

      - name: Generate controlled schematic
        run: |
          set -euo pipefail
          python3 hardware/kicad/tools/generate_reva_schematic.py
          test -s hardware/kicad/Automatrix_PVDG_RevA.kicad_sch
          echo "Generated schematic bytes: $(wc -c < hardware/kicad/Automatrix_PVDG_RevA.kicad_sch)"

      - name: Probe KiCad scripting environment
        run: |
          set -u
          echo '=== pcbnew module locations ==='
          find /Applications/KiCad/KiCad.app/Contents -name 'pcbnew.py' -o -name '_pcbnew*.so' 2>/dev/null | head -20 || true
          echo '=== system python pcbnew ==='
          python3 - <<'PY'
          try:
              import pcbnew
              print('SYSTEM_PYTHON_PCBNEW=YES', pcbnew.GetBuildVersion())
          except Exception as exc:
              print('SYSTEM_PYTHON_PCBNEW=NO', repr(exc))
          PY
          echo '=== KiCad library roots ==='
          find /Applications/KiCad/KiCad.app/Contents/SharedSupport -maxdepth 4 -type d \( -name '*.pretty' -o -name 'symbols' \) 2>/dev/null | head -30 || true

      - name: Probe legacy schematic upgrade behavior
        run: |
          set -euo pipefail
          KICAD='/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli'
          TMP="$(mktemp -d)"
          cp hardware/kicad/tools/legacy_probe.sch "$TMP/legacy_probe.sch"
          "$KICAD" sch upgrade "$TMP/legacy_probe.sch"
          find "$TMP" -maxdepth 1 -type f -print

      - name: Project syntax and schematic ERC
        run: |
          set -euo pipefail
          KICAD='/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli'
          SCH='hardware/kicad/Automatrix_PVDG_RevA.kicad_sch'
          PRO='hardware/kicad/Automatrix_PVDG_RevA.kicad_pro'
          python3 -m json.tool "$PRO" >/dev/null
          "$KICAD" sch upgrade --force "$SCH"
          "$KICAD" sch erc --severity-all --exit-code-violations --output hardware/kicad/Automatrix_PVDG_RevA-erc.rpt "$SCH"
          "$KICAD" sch export netlist --format kicadsexpr --output hardware/kicad/Automatrix_PVDG_RevA.net "$SCH"
          "$KICAD" sch export bom --output hardware/kicad/Automatrix_PVDG_RevA-bom.csv "$SCH"
          "$KICAD" sch export pdf --output hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf "$SCH"

      - name: Design-control checks
        run: |
          python3 hardware/kicad/tools/validate_design_control.py

      - name: Persist validated native schematic
        run: |
          set -euo pipefail
          git add hardware/kicad/Automatrix_PVDG_RevA.kicad_sch
          if git diff --cached --quiet; then
            echo 'Native schematic already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hw: persist KiCad-validated Rev-A schematic'
          git push origin HEAD:hardware/kicad-reva-implementation

      - name: Upload KiCad validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reva-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            hardware/kicad/Automatrix_PVDG_RevA-erc.rpt
            hardware/kicad/Automatrix_PVDG_RevA.net
            hardware/kicad/Automatrix_PVDG_RevA-bom.csv
            hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf
