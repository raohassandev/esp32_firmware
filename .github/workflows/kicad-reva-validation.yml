name: KiCad Rev-A validation

on:
  push:
    branches:
      - hardware/kicad-reva-implementation
    paths:
      - 'hardware/kicad/**'
      - '.github/workflows/kicad-reva-validation.yml'

permissions:
  contents: write

concurrency:
  group: kicad-reva-implementation
  cancel-in-progress: true

jobs:
  kicad-10-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull official KiCad 10.0.5 image
        run: |
          set -euo pipefail
          docker pull kicad/kicad:10.0.5
          docker run --rm kicad/kicad:10.0.5 kicad-cli version --format about

      - name: Generate controlled schematic
        run: |
          set -euo pipefail
          python3 hardware/kicad/tools/run_reva_generator.py
          test -s hardware/kicad/Automatrix_PVDG_RevA.kicad_sch
          test -s hardware/kicad/Automatrix.kicad_sym
          test -s hardware/kicad/sym-lib-table
          test -s hardware/kicad/fp-lib-table
          test -s hardware/kicad/REFERENCE_MAP.json
          echo "Generated schematic bytes: $(wc -c < hardware/kicad/Automatrix_PVDG_RevA.kicad_sch)"
          python3 -m json.tool hardware/kicad/Automatrix_PVDG_RevA.kicad_pro >/dev/null
          python3 -m json.tool hardware/kicad/REFERENCE_MAP.json >/dev/null

      - name: KiCad schematic parse, ERC and exports
        run: |
          set -euo pipefail
          K="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work kicad/kicad:10.0.5 kicad-cli"
          SCH='hardware/kicad/Automatrix_PVDG_RevA.kicad_sch'
          $K sch upgrade --force "$SCH"
          set +e
          $K sch erc --severity-all --exit-code-violations --output hardware/kicad/Automatrix_PVDG_RevA-erc.rpt "$SCH"
          ERC_RC=$?
          set -e
          echo "ERC_EXIT_CODE=$ERC_RC" >> "$GITHUB_ENV"
          cat hardware/kicad/Automatrix_PVDG_RevA-erc.rpt || true
          $K sch export netlist --format kicadsexpr --output hardware/kicad/Automatrix_PVDG_RevA.net "$SCH"
          $K sch export bom --output hardware/kicad/Automatrix_PVDG_RevA-bom.csv "$SCH"
          $K sch export pdf --output hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf "$SCH"

      - name: Independently audit exported physical pin nets
        run: python3 hardware/kicad/tools/validate_exported_netlist.py

      - name: Enforce canonical annotation
        run: |
          python3 - <<'PY'
          import csv,re
          p='hardware/kicad/Automatrix_PVDG_RevA-bom.csv'
          rows=list(csv.DictReader(open(p,encoding='utf-8-sig')))
          refs=[]
          for row in rows:
              refs.extend(x.strip() for x in row['Refs'].split(',') if x.strip())
          bad=[r for r in refs if not re.fullmatch(r'[A-Za-z]+\d+',r)]
          dup=sorted({r for r in refs if refs.count(r)>1})
          if bad or dup:
              raise SystemExit(f'annotation FAIL bad={bad} duplicate={dup}')
          print(f'canonical annotation: PASS ({len(refs)} unique references)')
          PY

      - name: Design-control checks
        run: python3 hardware/kicad/tools/validate_design_control.py

      - name: Confirm KiCad pcbnew scripting support
        run: |
          set -euo pipefail
          docker run --rm kicad/kicad:10.0.5 python3 -c 'import pcbnew; print("PCBNEW_PYTHON=YES", pcbnew.GetBuildVersion())'

      - name: Generate deterministic PCB placement
        run: |
          set -euo pipefail
          docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -e KICAD10_FOOTPRINT_DIR=/usr/share/kicad/footprints -v $PWD:/work -w /work kicad/kicad:10.0.5 \
            python3 hardware/kicad/tools/build_reva_pcb_final.py 2>&1 | tee hardware/kicad/placement.log
          test -s hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb

      - name: PCB DRC diagnostics and manufacturing preview
        run: |
          set -euo pipefail
          PCB='hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb'
          K="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work kicad/kicad:10.0.5 kicad-cli"
          $K pcb upgrade --force "$PCB"
          set +e
          $K pcb drc --schematic-parity --severity-all --exit-code-violations --refill-zones --save-board --output hardware/kicad/Automatrix_PVDG_RevA-drc.rpt "$PCB"
          DRC_RC=$?
          set -e
          echo "DRC_EXIT_CODE=$DRC_RC" >> "$GITHUB_ENV"
          echo '=== PCB DRC REPORT ==='
          cat hardware/kicad/Automatrix_PVDG_RevA-drc.rpt || true
          $K pcb export stats --format json --output hardware/kicad/Automatrix_PVDG_RevA-stats.json "$PCB"
          set +e
          $K pcb export step --force --no-dnp --output hardware/kicad/Automatrix_PVDG_RevA.step "$PCB"
          STEP_RC=$?
          set -e
          echo "STEP_EXIT_CODE=$STEP_RC" >> "$GITHUB_ENV"

      - name: Persist generated native sources
        if: env.ERC_EXIT_CODE == '0'
        run: |
          set -euo pipefail
          git add \
            hardware/kicad/Automatrix_PVDG_RevA.kicad_sch \
            hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb \
            hardware/kicad/Automatrix.kicad_sym \
            hardware/kicad/sym-lib-table \
            hardware/kicad/fp-lib-table \
            hardware/kicad/REFERENCE_MAP.json
          if git diff --cached --quiet; then
            echo 'KiCad native sources already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'pcb: persist KiCad 10 Rev-A placement checkpoint'
          git push origin HEAD:hardware/kicad-reva-implementation

      - name: Upload KiCad validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reva-validation
          if-no-files-found: warn
          retention-days: 14
          path: |
            hardware/kicad/placement.log
            hardware/kicad/Automatrix_PVDG_RevA-erc.rpt
            hardware/kicad/Automatrix_PVDG_RevA.net
            hardware/kicad/Automatrix_PVDG_RevA-bom.csv
            hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf
            hardware/kicad/Automatrix_PVDG_RevA-drc.rpt
            hardware/kicad/Automatrix_PVDG_RevA-stats.json
            hardware/kicad/Automatrix_PVDG_RevA.step

      - name: Enforce H1 clean schematic gate
        if: always()
        run: |
          echo "ERC exit code: ${ERC_EXIT_CODE:-missing}"
          test "${ERC_EXIT_CODE:-99}" = "0"

      - name: Enforce H2 only after routing-complete marker
        if: always()
        run: |
          if [ -f hardware/kicad/H2_ROUTING_COMPLETE ]; then
            echo "H2 routing marker present; DRC must be clean."
            test "${DRC_EXIT_CODE:-99}" = "0"
            test "${STEP_EXIT_CODE:-99}" = "0"
          else
            echo "H2 is still in implementation; DRC diagnostics captured without completion claim."
          fi
