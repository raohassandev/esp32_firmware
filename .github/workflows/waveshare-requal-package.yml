name: Waveshare physical requalification package

on:
  pull_request:
    paths:
      - '.github/workflows/waveshare-requal-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-exact-requal-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: 02bc128a84a853c988bc53f5daa53aa76c7bfb72
      CANDIDATE_TREE: 08b5a5bff67259d7f7324084bdb9121dab27086c
      FIX_HEAD: 525b7cf8f6b12b8a055f3514fc24f6c24a8d45a8
      FAILED_CANDIDATE_SHA: ec4fb846875d67a806c2b7cc48b21d5706f91995
      PRODUCT_DIR: boards/waveshare_esp32_s3_touch_lcd_5/screen/product_800x480
    steps:
      - name: Check out exact new integration candidate
        uses: actions/checkout@v4
        with:
          ref: 02bc128a84a853c988bc53f5daa53aa76c7bfb72
          fetch-depth: 0

      - name: Verify candidate identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain)"
          printf 'candidate_sha=%s\ncandidate_tree=%s\nfix_head=%s\n' "$CANDIDATE_SHA" "$CANDIDATE_TREE" "$FIX_HEAD"

      - name: Build exact Product Core plus 800x480 LCD image and verify effective memory policy
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w "/project/$PRODUCT_DIR" \
            espressif/idf:v6.0.1 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build && test -f build/automatrix_pvdg_waveshare_800x480.bin && grep -qx "CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=512" sdkconfig && grep -qx "CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=98304" sdkconfig && grep -qx "CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y" sdkconfig'

      - name: Assemble and self-verify exact flash package
        run: |
          set -euo pipefail
          build="$PRODUCT_DIR/build"
          package="$GITHUB_WORKSPACE/waveshare-exact-requal-candidate"
          mkdir -p "$package"
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r -d '' file; do
            mkdir -p "$package/$(dirname "$file")"
            cp "$file" "$package/$file"
          done < <(find "$build" -maxdepth 4 -type f \
            \( -name '*.bin' -o -name 'flasher_args.json' -o -name 'flash_args' -o -name 'flash_project_args' -o -name 'project_description.json' \) \
            -print0)

          cat > "$package/CANDIDATE.txt" <<EOF
          candidate_sha=$CANDIDATE_SHA
          candidate_tree=$CANDIDATE_TREE
          fix_head=$FIX_HEAD
          failed_candidate_sha=$FAILED_CANDIDATE_SHA
          esp_idf=6.0.1
          product_dir=$PRODUCT_DIR
          source_pr=36
          memory_always_internal=512
          memory_reserve_internal=98304
          EOF

          test -s "$package/$build/automatrix_pvdg_waveshare_800x480.bin"
          test -s "$package/$build/bootloader/bootloader.bin"
          test -s "$package/$build/partition_table/partition-table.bin"
          test -s "$package/$build/flasher_args.json"
          test -s "$package/$build/flash_args"
          test -s "$package/$build/flash_project_args"
          test -s "$package/CANDIDATE.txt"

          cd "$package"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload exact requalification hardware package
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-800x480-02bc128a
          path: waveshare-exact-requal-candidate
          if-no-files-found: error
          retention-days: 14
