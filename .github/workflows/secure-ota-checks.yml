name: Secure OTA checks

on:
  pull_request:
    paths:
      - 'components/ota_manager/**'
      - 'components/web_server/ota_api.c'
      - 'components/web_server/include/ota_api.h'
      - 'components/web_server/CMakeLists.txt'
      - 'components/web_server/web_server.c'
      - 'components/app_core/**'
      - 'main/**'
      - 'web/ota.js'
      - 'web/ota.css'
      - 'web/app.js.order'
      - 'web/app.css.order'
      - 'sdkconfig.defaults'
      - 'partitions.csv'
      - 'tests/ota_*'
      - '.github/workflows/secure-ota-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check OTA browser module
        run: node --check web/ota.js
      - name: Verify current-baseline OTA safety contract
        run: python3 tests/ota_current_baseline_source_contract.py
      - name: Execute source-coupled OTA behavior proof
        run: python3 tests/ota_update_behavior_contract.py
      - name: Recheck HTTP handler capacity after OTA routes
        run: python3 tests/uri_handler_capacity_source_contract.py
