name: Lane A commissioning refresh patch

on:
  push:
    branches:
      - 'work/waveshare/flicker-stabilization'
    paths:
      - 'tools/patch_lane_a_commissioning_refresh.py'
      - '.github/workflows/lane-a-commissioning-refresh-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/waveshare/flicker-stabilization
      - name: Patch commissioning refresh and source contract
        run: |
          set -euo pipefail
          python3 tools/patch_lane_a_commissioning_refresh.py
          python3 tests/waveshare_flicker_source_contract.py
      - name: Commit patch and remove one-shot helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add boards/waveshare_esp32_s3_touch_lcd_5/screen/pages/commissioning_screen.c tests/waveshare_flicker_source_contract.py
          git rm tools/patch_lane_a_commissioning_refresh.py .github/workflows/lane-a-commissioning-refresh-patch.yml
          git commit -m 'fix(waveshare): avoid unchanged commissioning redraws'
          git push origin HEAD:work/waveshare/flicker-stabilization
