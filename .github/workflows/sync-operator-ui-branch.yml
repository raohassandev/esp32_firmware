name: Sync operator UI branch

on:
  pull_request:
    branches:
      - phase1-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
          fetch-depth: 0
      - name: Merge current base without rewriting history
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin phase1-fix
          git merge --no-ff --no-commit origin/phase1-fix
          git checkout --ours .github/workflows/esp-idf-build.yml
          git add .github/workflows/esp-idf-build.yml
          git commit -m "Merge phase1-fix into operator UI refinement"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
