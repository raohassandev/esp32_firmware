name: KiCad Rev-A PR validation

on:
  pull_request:
    paths:
      - 'hardware/kicad/**'
      - 'hardware/mechanical/**'
      - 'docs/PCB_PROVIDER_HANDOFF_READINESS.md'
      - '.github/workflows/kicad-reva-pr-validation.yml'
      - '.github/workflows/kicad-reva-validation.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kicad-reva-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  kicad-10-pr-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull official KiCad 10.0.5 image
        run: |
          set -euo pipefail
          docker pull kicad/kicad:10.0.5
          docker run --rm kicad/kicad:10.0.5 kicad-cli version --format about

      - name: Verify frozen H2 checkpoint provenance
        run: |
          set -euo pipefail
          MARKER='hardware/kicad/H2_ROUTING_COMPLETE'
          PCB='hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb'
          SCH='hardware/kicad/Automatrix_PVDG_RevA.kicad_sch'
          test -s "$MARKER"
          test -s "$PCB"
          test -s "$SCH"
          test ! -e hardware/kicad/Automatrix_PVDG_RevA.kicad_dru
          grep -Fx 'H2 routing complete' "$MARKER"
          grep -Fx 'ERC=0' "$MARKER"
          grep -Fx 'DRC=0' "$MARKER"
          grep -Fx 'UNCONNECTED=0' "$MARKER"
          grep -Fx 'L2_GND=PASS' "$MARKER"
          grep -Fx 'SIGNAL_INTEGRITY_GEOMETRY=PASS' "$MARKER"
          grep -Fx 'STEP=0' "$MARKER"

          H2_COMMIT="$(git log -1 --format=%H -- "$MARKER")"
          test -n "$H2_COMMIT"
          echo "H2_CHECKPOINT_SHA=$H2_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen H2 checkpoint: $H2_COMMIT"

          if ! git diff --quiet "$H2_COMMIT"..HEAD -- hardware/kicad hardware/mechanical; then
            echo 'ERROR: routing-sensitive hardware changed after the frozen H2 checkpoint.'
            echo 'Run the controlled H2 release workflow to create a new routed checkpoint; PR validation will not reroute nondeterministically.'
            git diff --name-status "$H2_COMMIT"..HEAD -- hardware/kicad hardware/mechanical
            exit 1
          fi

          test "$(git rev-parse "$H2_COMMIT:$MARKER")" = "$(git hash-object "$MARKER")"
          test "$(git rev-parse "$H2_COMMIT:$PCB")" = "$(git hash-object "$PCB")"
          echo 'FROZEN_H2_PROVENANCE=PASS'

      - name: Validate committed schematic and electrical contracts
        run: |
          set -euo pipefail
          SCH='hardware/kicad/Automatrix_PVDG_RevA.kicad_sch'
          K="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work kicad/kicad:10.0.5 kicad-cli"
          $K sch erc --severity-all --exit-code-violations --output hardware/kicad/Automatrix_PVDG_RevA-erc.rpt "$SCH"
          $K sch export netlist --format kicadsexpr --output hardware/kicad/Automatrix_PVDG_RevA.net "$SCH"
          $K sch export bom --output hardware/kicad/Automatrix_PVDG_RevA-bom.csv "$SCH"
          $K sch export pdf --output hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf "$SCH"
          python3 hardware/kicad/tools/validate_exported_netlist.py
          python3 hardware/kicad/tools/validate_design_control.py
          python3 hardware/kicad/tools/validate_hw_interface_contract.py
          python3 hardware/kicad/tools/validate_power_relay_budget.py
          python3 - <<'PY'
          import csv,re
          rows=list(csv.DictReader(open('hardware/kicad/Automatrix_PVDG_RevA-bom.csv',encoding='utf-8-sig')))
          refs=[]
          for row in rows:
              refs.extend(x.strip() for x in row['Refs'].split(',') if x.strip())
          bad=[r for r in refs if not re.fullmatch(r'[A-Za-z]+\d+',r)]
          dup=sorted({r for r in refs if refs.count(r)>1})
          if bad or dup:
              raise SystemExit(f'annotation FAIL bad={bad} duplicate={dup}')
          print(f'canonical annotation PASS: {len(refs)} unique references')
          PY

      - name: Validate frozen routed PCB DRC SI and STEP
        run: |
          set -uo pipefail
          PCB='hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb'
          DRC_PCB='hardware/kicad/Automatrix_PVDG_RevA-pr-drc-replay.kicad_pcb'
          K="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work kicad/kicad:10.0.5 kicad-cli"
          KPY="docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work kicad/kicad:10.0.5 python3"

          # Reproduce the successful H2 release semantics exactly without
          # mutating the frozen committed PCB: upgrade a byte-for-byte copy,
          # then run the same refill/save DRC command used by the release job.
          cp "$PCB" "$DRC_PCB"
          set +e
          $K pcb upgrade --force "$DRC_PCB"
          UPGRADE_RC=$?
          $K pcb drc --severity-all --exit-code-violations --refill-zones --save-board \
            --output hardware/kicad/Automatrix_PVDG_RevA-drc.rpt "$DRC_PCB"
          DRC_RC=$?
          $KPY hardware/kicad/tools/validate_signal_integrity.py "$PCB" hardware/kicad/Automatrix_PVDG_RevA-si.rpt
          SI_RC=$?
          $K pcb export stats --format json --output hardware/kicad/Automatrix_PVDG_RevA-stats.json "$PCB"
          STATS_RC=$?
          $K pcb export step --force --no-dnp --output hardware/kicad/Automatrix_PVDG_RevA.step "$PCB"
          STEP_RC=$?
          set -e

          echo "UPGRADE_RC=$UPGRADE_RC DRC_RC=$DRC_RC SI_RC=$SI_RC STATS_RC=$STATS_RC STEP_RC=$STEP_RC"
          echo '--- DRC REPORT ---'
          cat hardware/kicad/Automatrix_PVDG_RevA-drc.rpt || true
          echo '--- SI REPORT ---'
          cat hardware/kicad/Automatrix_PVDG_RevA-si.rpt || true

          test "$UPGRADE_RC" = '0'
          test "$DRC_RC" = '0'
          test "$SI_RC" = '0'
          test "$STATS_RC" = '0'
          test "$STEP_RC" = '0'
          grep -F 'L2_GND=PASS' hardware/kicad/Automatrix_PVDG_RevA-si.rpt
          grep -F 'SIGNAL_INTEGRITY_GEOMETRY=PASS' hardware/kicad/Automatrix_PVDG_RevA-si.rpt

      - name: Validate mechanical and provider handoff from frozen PCB
        run: |
          set -euo pipefail
          docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work \
            kicad/kicad:10.0.5 python3 hardware/mechanical/tools/extract_pcb_mechanics.py
          python3 hardware/mechanical/tools/validate_enclosure_contract.py
          docker run --rm -u $(id -u):$(id -g) -e HOME=/tmp -v $PWD:/work -w /work \
            kicad/kicad:10.0.5 bash hardware/kicad/tools/export_manufacturing_outputs.sh
          python3 hardware/kicad/tools/build_provider_package.py
          test -n "$(find provider_release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          echo 'FROZEN_H2_PROVIDER_HANDOFF=PASS'

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-reva-pr-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            hardware/kicad/H2_ROUTING_COMPLETE
            hardware/kicad/Automatrix_PVDG_RevA.kicad_pcb
            hardware/kicad/Automatrix_PVDG_RevA-pr-drc-replay.kicad_pcb
            hardware/kicad/Automatrix_PVDG_RevA.kicad_sch
            hardware/kicad/Automatrix.kicad_sym
            hardware/kicad/REFERENCE_MAP.json
            hardware/kicad/Automatrix_PVDG_RevA-erc.rpt
            hardware/kicad/Automatrix_PVDG_RevA-drc.rpt
            hardware/kicad/Automatrix_PVDG_RevA-si.rpt
            hardware/kicad/Automatrix_PVDG_RevA.net
            hardware/kicad/Automatrix_PVDG_RevA-bom.csv
            hardware/kicad/Automatrix_PVDG_RevA-schematic.pdf
            hardware/kicad/Automatrix_PVDG_RevA-stats.json
            hardware/kicad/Automatrix_PVDG_RevA.step
            hardware/mechanical/PCB_MECHANICAL_HANDOFF.json
            hardware/kicad/manufacturing/**
            provider_release/*.zip
