name: Apply operator browser runtime patch

on:
  pull_request:
    branches:
      - phase1-fix
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
      - name: Apply and verify frontend patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('web/pvdg-chart.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = {
              '    .pvc-figure { height: 260px; }': '    body.product-experience-v2 .pvc-figure { height: 260px; }',
              '    .pvc-figure { height: 236px; }': '    body.product-experience-v2 .pvc-figure { height: 236px; }',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'missing expected chart rule: {old}')
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          workflow_path = Path('.github/workflows/esp-idf-build.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          step = (
              '      - name: Run operator UI Chromium runtime contract\n'
              '        run: node tests/operator_ui_browser_runtime_test.mjs\n'
          )
          marker = '      - name: Run source mode safety unit tests\n'
          if 'Run operator UI Chromium runtime contract' not in workflow:
              if marker not in workflow:
                  raise SystemExit('could not locate browser contract insertion point')
              workflow = workflow.replace(marker, step + marker, 1)
              workflow_path.write_text(workflow, encoding='utf-8')
          PY
          node tests/operator_ui_browser_runtime_test.mjs
          rm .github/workflows/ui-browser-runtime-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/pvdg-chart.css .github/workflows/esp-idf-build.yml .github/workflows/ui-browser-runtime-patch.yml
          git commit -m "test(web): enforce responsive operator runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'agent/operator-ui-refinement' }}
