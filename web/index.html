<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Automatrix PV-DG Controller</title>
<style>
:root{font-family:Arial,sans-serif;color:#eaf0f8;background:#08182b;--panel:#10243d;--line:#29425f;--orange:#f58b28;--muted:#9fb0c5}*{box-sizing:border-box}body{margin:0}.shell{max-width:1120px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:22px;font-weight:700}.brand span{color:var(--orange)}.badge{padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.label{color:var(--muted);font-size:12px;text-transform:uppercase}.value{font-size:28px;font-weight:700;margin-top:8px}.panel{margin-top:14px}.panel h2{margin:0 0 14px;font-size:17px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{display:block;color:var(--muted);font-size:12px}input{width:100%;margin-top:6px;padding:10px;border-radius:7px;border:1px solid var(--line);background:#08182b;color:#fff}button{border:0;border-radius:7px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--orange);color:#111}.secondary{background:#263d59;color:#fff}.actions{display:flex;gap:10px;margin-top:15px}.status{margin-left:auto;color:var(--muted)}textarea{width:100%;min-height:180px;background:#08182b;color:#dce8f7;border:1px solid var(--line);border-radius:8px;padding:12px}@media(max-width:760px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid,.form{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style>
</head>
<body><div class="shell">
<div class="top"><div class="brand">AUTOMATRIX <span>PV-DG</span></div><div class="badge" id="connection">Connecting…</div></div>
<div class="grid">
<div class="card"><div class="label">Grid power</div><div class="value" id="grid">-- kW</div></div>
<div class="card"><div class="label">PV command</div><div class="value" id="pv">-- kW</div></div>
<div class="card"><div class="label">Control mode</div><div class="value" id="mode">--</div></div>
<div class="card"><div class="label">Alarms</div><div class="value" id="alarms">--</div></div>
</div>
<div class="panel"><h2>Quick configuration</h2><div class="form">
<label>Wi-Fi SSID<input id="ssid"></label><label>ZLAN IP<input id="zlan"></label><label>ZLAN port<input id="zport" type="number"></label>
<label>Meter unit ID<input id="unit" type="number"></label><label>Power register<input id="address" type="number"></label><label>Power scale<input id="scale" type="number" step="0.001"></label>
<label>Grid import target kW<input id="target" type="number" step="0.1"></label><label>Deadband kW<input id="deadband" type="number" step="0.1"></label><label>Control interval ms<input id="interval" type="number"></label>
</div><div class="actions"><button class="primary" onclick="saveQuick()">Save configuration</button><button class="secondary" onclick="exportConfig()">Export JSON</button><span class="status" id="message"></span></div></div>
<div class="panel"><h2>Import / advanced JSON</h2><textarea id="json"></textarea><div class="actions"><button class="primary" onclick="importConfig()">Validate and save</button><button class="secondary" onclick="loadConfig()">Reload</button></div></div>
</div>
<script>
let cfg=null;const modes=['Disabled','Grid','Generator','Manual','Failsafe','Emergency'];
async function refresh(){try{const s=await fetch('/api/status').then(r=>r.json());grid.textContent=s.grid_power_kw.toFixed(2)+' kW';pv.textContent=s.applied_pv_kw.toFixed(2)+' kW';mode.textContent=modes[s.mode]||s.mode;alarms.textContent=s.alarms?'0x'+s.alarms.toString(16):'Clear';connection.textContent=s.network_online?'Online · '+s.ip:'Network offline'}catch(e){connection.textContent='Controller unavailable'}}
async function loadConfig(){cfg=await fetch('/api/config').then(r=>r.json());json.value=JSON.stringify(cfg,null,2);ssid.value=cfg.wifi?.ssid||'';const m=cfg.meters?.[0]||{};zlan.value=m.host||'';zport.value=m.port||502;unit.value=m.unit_id||1;address.value=m.active_power_address||0;scale.value=m.scale??1;target.value=cfg.control?.grid_import_target_kw??5;deadband.value=cfg.control?.deadband_kw??2;interval.value=cfg.control?.interval_ms??250}
async function postConfig(data){message.textContent='Saving…';const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});message.textContent=r.ok?'Saved; restart controller to apply':'Save failed'}
function saveQuick(){if(!cfg)return;cfg.wifi.ssid=ssid.value;const m=cfg.meters[0];m.host=zlan.value;m.port=+zport.value;m.unit_id=+unit.value;m.active_power_address=+address.value;m.scale=+scale.value;cfg.control.grid_import_target_kw=+target.value;cfg.control.deadband_kw=+deadband.value;cfg.control.interval_ms=+interval.value;json.value=JSON.stringify(cfg,null,2);postConfig(cfg)}
function importConfig(){try{cfg=JSON.parse(json.value);postConfig(cfg)}catch(e){message.textContent='Invalid JSON'}}
function exportConfig(){const blob=new Blob([json.value],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='automatrix-pvdg-config.json';a.click();URL.revokeObjectURL(a.href)}
loadConfig();refresh();setInterval(refresh,1000);
</script></body></html>
